name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+asyncpg://grok:grok@localhost:5432/grok
  REDIS_URL: redis://localhost:6379/0
  APP_ENV: development
  APP_SECRET_KEY: test-secret-key-for-ci-testing-purposes-only-32chars
  APP_CORS_ORIGINS: http://localhost:3000
  ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktdGVzdGluZw==
  ENCRYPTION_ALGORITHM: AES-256-GCM
  AI_PROVIDER: mock
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0
  SYNC_GMAIL_INTERVAL: 5
  SYNC_CALENDAR_INTERVAL: 5
  SYNC_TASKS_INTERVAL: 15
  BRIEFING_DEFAULT_TIME: "07:00"
  RATE_LIMIT_REQUESTS: 100
  RATE_LIMIT_WINDOW: 60
  LOG_LEVEL: INFO
  LOG_FORMAT: json

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Run ruff
        run: cd backend && ruff check .
      - name: Run mypy
        run: cd backend && mypy .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grok
          POSTGRES_USER: grok
          POSTGRES_PASSWORD: grok
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Run migrations
        run: cd backend && alembic upgrade head
      - name: Run tests
        run: cd backend && pytest -xvs --cov=app --cov-fail-under=70

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run lint
        run: cd frontend && npm run lint
      - name: Run typecheck
        run: cd frontend && npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm run test:ci

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t grok-backend ./backend
      - name: Build frontend
        run: docker build -t grok-frontend ./frontend
      - name: Validate docker-compose
        run: docker compose config -q