[project]
name = "grok-backend"
version = "0.1.0"
description = "GROK Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.111.*",
    "sqlalchemy[asyncio]==2.0.*",
    "alembic==1.12.*",
    "asyncpg==0.29.*",
    "pydantic[email]==2.8.*",
    "pydantic-settings==2.3.*",
    "httpx==0.27.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[bcrypt]==1.7.*",
    "python-multipart==0.0.*",
    "celery[redis]==5.4.*",
    "apscheduler==3.10.*",
    "redis==5.0.*",
    "structlog==24.1.*",
    "cryptography==42.0.*",
    "email-validator==2.1.*",
    "python-dotenv==1.0.*",
    "openai==1.42.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.*",
    "pytest-asyncio==0.23.*",
    "pytest-mock==3.12.*",
    "pytest-cov==5.0.*",
    "httpx==0.27.*",
    "ruff==0.5.*",
    "mypy==1.10.*",
    "factory-boy==3.3.*",
    "faker==25.1.*",
    "respx==0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
ignore = ["S101", "S311", "S603", "S607"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607"]
"alembic/*" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "sqlalchemy.*",
    "pydantic.*",
    "fastapi.*",
    "celery.*",
    "redis.*",
    "apscheduler.*",
    "pytest.*",
    "httpx.*",
    "structlog.*",
    "cryptography.*",
    "passlib.*",
    "jose.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]